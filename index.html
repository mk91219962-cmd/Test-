<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ESP32-CAM Sender (الموبايل)</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        textarea { width: 90%; height: 80px; background: #1e293b; color: #38bdf8; border: 1px solid #334155; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; margin: 8px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>كاميرا الروبوت (الموبايل)</h2>
    <p>الحالة: <span id="status" style="color:orange;">في الانتظار...</span></p>
    <video id="localVideo" autoplay playsinline muted style="width:100%; max-width:320px; background:#000; border-radius:8px;"></video>
    <br>
    <button id="startBtn">1. تشغيل الكاميرا وإنشاء Offer</button>
    <br>
    <textarea id="offerBox" placeholder="انسخ الـ Offer وحطه في الكمبيوتر..."></textarea>
    <br>
    <textarea id="answerBox" placeholder="حط الـ Answer هنا من الكمبيوتر..."></textarea>
    <br>
    <button id="connectBtn">2. ربط الاتصال النهائي</button>
    <p id="log" style="color: #4ade80;"></p>

    <script>
        let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        let dataChannel;
        let localStream;

        document.getElementById('startBtn').onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('localVideo').srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                dataChannel = pc.createDataChannel("commands");
                setupDataChannel();

                let offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                setTimeout(() => {
                    document.getElementById('offerBox').value = JSON.stringify(pc.localDescription);
                    document.getElementById('status').innerText = "تم إنشاء الـ Offer، انقله للكمبيوتر";
                }, 1000);
            } catch (e) { alert("خطأ كاميرا: " + e); }
        };

        document.getElementById('connectBtn').onclick = async () => {
            let answer = JSON.parse(document.getElementById('answerBox').value);
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            document.getElementById('status').innerText = "متصل بنجاح بالموبايل!";
        };

        function setupDataChannel() {
            dataChannel.onopen = () => document.getElementById('log').innerText = "قناة الأوامر جاهزة!";
            dataChannel.onmessage = e => {
                document.getElementById('log').innerText = "أمر مستقبل: " + e.data;
                if(e.data === 'vibrate') navigator.vibrate(400);
                else if(e.data === 'flash') alert("تنبيه: وصل أمر الفلاش!");
            };
        }
    </script>
</body>
</html>
